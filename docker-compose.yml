services:
  postgres:
    image: postgres:16-alpine
    container_name: meal_hq_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: meal_hq
      POSTGRES_PASSWORD: meal_hq
      POSTGRES_DB: meal_hq
    ports:
      - "5433:5432"
    volumes:
      - meal_hq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal_hq -d meal_hq"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  meal_hq_pgdata:
